name: Validate
on:
  pull_request:
  push:
    branches: [main, feat/portable-adoption-v1]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python va.py skills check
      - run: python va.py methods > /dev/null
      - run: python vm.py doctor
      - run: python vm.py adopt --task "product customer discovery" --phase in-flight > /dev/null
      - run: venturemethod assess examples/portable/host-unmet.json > /dev/null
      - run: venturemethod assess examples/portable/host-covered.json > /dev/null
