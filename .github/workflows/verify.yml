name: Validate
on:
  pull_request:
  push:
    branches: [main, feat/portable-adoption-v1]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - run: |
          skills-ref validate .agents/skills/venturemethod
          for item in skills/*; do skills-ref validate "$item"; done
      - run: python va.py skills check
      - run: python va.py methods > /dev/null
      - run: python vm.py doctor
      - run: python vm.py adopt --task "product customer discovery" --phase in-flight > /dev/null
      - run: venturemethod assess examples/portable/host-unmet.json > /dev/null
      - run: venturemethod plan examples/portable/host-unmet.json > /dev/null
      - run: venturemethod compose examples/portable/host-unmet.json > /tmp/venturemethod-composition.json
      - run: venturemethod providers > /dev/null
      - run: venturemethod assess examples/portable/host-covered.json > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save ajv@8.17.1 @modelcontextprotocol/client@2.4.0
      - run: node scripts/contract-interop.mjs
        env:
          VM_COMPOSITION_FILE: /tmp/venturemethod-composition.json
      - run: node scripts/mcp-node-roundtrip.mjs
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/venturemethod-wheel-test
          /tmp/venturemethod-wheel-test/bin/pip install dist/*.whl
          (cd /tmp && /tmp/venturemethod-wheel-test/bin/venturemethod search product > /dev/null)
          (cd /tmp && /tmp/venturemethod-wheel-test/bin/venturemethod assess "$GITHUB_WORKSPACE/examples/portable/host-unmet.json" > /dev/null)
          (cd /tmp && /tmp/venturemethod-wheel-test/bin/venturemethod export-skill --destination /tmp/vm-host/.agents/skills/venturemethod --apply > /dev/null)
          test -f /tmp/vm-host/.agents/skills/venturemethod/references/skills/evidence-audit.md
          /tmp/venturemethod-wheel-test/bin/venturemethod verify-export --destination /tmp/vm-host/.agents/skills/venturemethod > /dev/null
          skills-ref validate /tmp/vm-host/.agents/skills/venturemethod

      - name: External host read-only adoption smoke test
        run: |
          git clone --quiet --no-checkout --filter=blob:none https://github.com/BradKhan/open-ASS.git /tmp/vm-openass-host
          git -C /tmp/vm-openass-host fetch --quiet --depth 1 origin 35f10ba4cb7556b96f98e334ecce64a5f945c975
          git -C /tmp/vm-openass-host checkout --quiet --detach 35f10ba4cb7556b96f98e334ecce64a5f945c975
          venturemethod export-skill --destination /tmp/vm-openass-host/.agents/skills/venturemethod --apply > /dev/null
          venturemethod verify-export --destination /tmp/vm-openass-host/.agents/skills/venturemethod > /dev/null
          skills-ref validate /tmp/vm-openass-host/.agents/skills/venturemethod
          test -f /tmp/vm-openass-host/AGENTS.md
          git -C /tmp/vm-openass-host diff --quiet HEAD
